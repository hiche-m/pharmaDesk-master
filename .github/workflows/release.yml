name: Release Workflow

on:
  push:
    branches:
      - release  # Trigger on push to the `release` branch
     
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Step 2: Set Git configuration (user name and email)
      - name: Set Git user info
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Step 3: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 5: Run Standard Version (bumping version, creating changelog)
      - name: Run Standard Version
        run: npx standard-version

      # Step 6: Push version bump and tag
      - name: Push version bump and tag
        run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Package the Electron app (using electron-forge)
      - name: Build Electron app
        run: npm run package

      # Step 8: Zip the build output
      - name: Zip the build output
        run: |
          cd out
          zip -r build.zip *

      # Step 9: Get new version and changelog content
      - name: Get new version and changelog content
        id: changelog
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          CHANGELOG=$(cat CHANGELOG.md)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 10: Create GitHub release with changelog
      - name: Create GitHub Release with Changelog
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          release_name: Release v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      # Step 11: Upload build to GitHub release
      - name: Upload build to GitHub release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./out/build.zip
          asset_name: build.zip
          asset_content_type: application/zip
