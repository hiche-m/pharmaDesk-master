name: Release Workflow

on:
  push:
    branches:
      - release  # Trigger on push to the `release` branch
     
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set Git configuration (user name and email)
      - name: Set Git user info
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Step 3: Set up Node.js (Optional, in case you need Node.js for some other task)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'  # Specify your Node.js version (optional)

      # Step 4: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 5: Run Standard Version (bumping version, creating changelog)
      - name: Run Standard Version
        run: npm run release

      # Step 6: Push version bump and tag
      - name: Push version bump and tag
        run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Package the Electron app (using electron-forge)
      - name: Build Electron app
        run: npm run package  # This runs electron-forge package

      # Step 8: Zip the build output (assuming it's in `out` directory)
      - name: Zip the build output
        run: |
          cd out
          zip -r build.zip *

      # Step 9: Get version and changelog content for the release
      - name: Get new version and changelog content
        id: changelog
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          CHANGES=$(cat CHANGELOG.md)
          echo "::set-output name=version::$NEW_VERSION"
          echo "::set-output name=changelog::$CHANGES"

      # Step 10: Create GitHub release (with changelog) and capture release ID
      - name: Capture Changelog Content in Variable
        id: capture-changelog
        run: |
          CHANGES=$(cat CHANGELOG.md)
          echo "Captured Changelog Content:"
          echo "$CHANGES"
          echo "CHANGES=$CHANGES" >> $GITHUB_ENV

      - name: Create GitHub Release with Changelog
        run: |
          json=$(jq -n \
            --arg tag_name "v${{ steps.changelog.outputs.version }}" \
            --arg name "Release v${{ steps.changelog.outputs.version }}" \
            --arg body "$CHANGES" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false}')
          
          echo "Generated JSON for release:"
          echo "$json"
          
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$json" \
            https://api.github.com/repos/${{ github.repository }}/releases
          
      # Step 11: Upload build to GitHub release
      - name: Upload build to GitHub release
        run: |
          for file in ./out/build.zip; do
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.release_id }}/assets?name=$(basename $file)"
          done
