name: Release Workflow

on:
  push:
    branches:
      - afterRebase  # Trigger on push to the `main` branch

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js (Optional, in case you need Node.js for some other task)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'  # Specify your Node.js version (optional)

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run Standard Version for the first release (bumping version, creating changelog)
      - name: Run Standard Version for first release
        run: npm run release -- --first-release

      # Step 5: Push version bump and tag
      - name: Push version bump and tag
        run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Package the Electron app (using electron-forge)
      - name: Build Electron app
        run: npm run package  # This runs electron-forge package

      # Step 7: Zip the build output (assuming it's in `out` directory)
      - name: Zip the build output
        run: |
          cd out
          zip -r build.zip *
      # Zip the contents of the 'out' folder (adjust if needed)

      # Step 8: Get version and changelog content for the release
      - name: Get new version and changelog content
        id: changelog
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          CHANGES=$(cat CHANGELOG.md)
          echo "::set-output name=version::$NEW_VERSION"
          echo "::set-output name=changelog::$CHANGES"

      # Step 9: Create GitHub release (with changelog)
      - name: Create GitHub release
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -d '{
                "tag_name": "v${{ steps.changelog.outputs.version }}",
                "name": "Release v${{ steps.changelog.outputs.version }}",
                "body": "${{ steps.changelog.outputs.changelog }}",
                "draft": false,
                "prerelease": false
              }' \
            https://api.github.com/repos/${{ github.repository }}/releases

      # Step 10: Upload the zip file as a release asset
      - name: Upload build to GitHub release
        run: |
          # Assuming the zip file is created in the previous step and it's in the `out` folder
          for file in ./out/build.zip; do
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.id }}/assets?name=$(basename $file)"
          done
