name: Debug Workflow 

on:
  push:
    branches:
      - release  # Trigger on push to the `release` branch
     
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set Git configuration (user name and email)
      - name: Set Git user info
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Step 3: Set up Node.js (Optional, in case you need Node.js for some other task)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'  # Specify your Node.js version (optional)

      - name: Install dependencies
        run: npm install
            
      - name: Print changelog before standard-version
        run: cat CHANGELOG.md
      
      - name: Run standard-version
        run: npm run release
      
      - name: Print changelog after standard-version
        run: cat CHANGELOG.md
